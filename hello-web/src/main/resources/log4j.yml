    database:
      user: root
      nodeValue: org.apache.log4j.jdbc.JDBCAppender
      layout:
        ConversionPattern: '[%-5p] %d(%r) --> [%t] %l: %m %x %n'
        nodeValue: org.apache.log4j.PatternLayout
      URL: jdbc:mysql://localhost:3306/test
      sql: 'INSERT INTO LOG4J (Message) VALUES(''=[%-5p] %d(%r) --> [%t] %l: %m %x
        %n'')'
      password: ''
      driver: com.mysql.jdbc.Driver
    LF5_APPENDER:
      MaxNumberOfRecords: '2000'
      nodeValue: org.apache.log4j.lf5.LF5Appender
